name: build-desktop-release

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch: {}
  push:
    branches: [master]

concurrency:
  # Two runs resolving the overlay version at the same time would race for the
  # same release tag, so releases are serialised and stale runs are dropped.
  group: build-desktop-release
  cancel-in-progress: false

jobs:
  # Single source of truth for "what are we building and what will we call it".
  # Everything downstream consumes these outputs instead of re-reading
  # upstream.json, so the pin cannot shift between jobs mid-run.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      upstream_sha: ${{ steps.version.outputs.upstream_sha }}
      overlay_version: ${{ steps.version.outputs.overlay_version }}
      upstream_changed: ${{ steps.version.outputs.upstream_changed }}
      state_changed: ${{ steps.version.outputs.state_changed }}
      desktop_build_version: ${{ steps.version.outputs.desktop_build_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the overlay bump looks at commits since upstream.json
          # last changed.
          fetch-depth: 0

      - name: Resolve upstream pin and overlay version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve-version.py \
            --refresh-upstream \
            --count-local-commits \
            --probe-releases \
            --write \
            --github-output "$GITHUB_OUTPUT"

      # Persist the resolved pin so the next run starts from it instead of
      # re-deriving the same bump. Best effort: a protected branch just means
      # the operator lands it by hand, it must not fail the build.
      - name: Commit resolved versions
        if: steps.version.outputs.state_changed == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream.json patches/manifest.json
          git commit -m "chore(release): pin ${{ steps.version.outputs.upstream_tag }} overlay ${{ steps.version.outputs.overlay_version }} [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}" \
            || echo "::warning::could not push the resolved versions; update upstream.json manually"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Clone upstream hermes-agent
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "${{ needs.resolve.outputs.upstream_tag }}" "https://x-access-token:${{ github.token }}@github.com/NousResearch/hermes-agent.git" hermes-agent && exit 0
            echo "clone attempt $i failed; retrying in 45s"
            sleep 45
          done
          exit 1

      - name: Verify immutable upstream commit
        shell: bash
        run: |
          actual=$(git -C hermes-agent rev-parse HEAD)
          expected="${{ needs.resolve.outputs.upstream_sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "Pinned tag resolved to $actual, expected $expected"
            exit 1
          fi

      - name: Apply remote-only patch
        shell: bash
        run: |
          cp apps/desktop/electron/remote-bootstrap-policy.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-patch.py \
            hermes-agent/apps/desktop/electron/main.ts

      - name: Apply local-workspace-bridge patch
        shell: bash
        run: |
          cp apps/desktop/electron/local-workspace-bridge.ts hermes-agent/apps/desktop/electron/
          cp apps/desktop/electron/local-workspace-bridge.test.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-local-workspace-bridge.py \
            hermes-agent/apps/desktop/electron/main.ts \
            hermes-agent/apps/desktop/electron/preload.ts

      # Must run after the remote-only patch: it anchors on the import that
      # patch inserts, so a reordering fails loudly instead of silently.
      - name: Apply release-update-source patch
        shell: bash
        run: |
          cp apps/desktop/electron/release-update-source.ts hermes-agent/apps/desktop/electron/
          cp apps/desktop/electron/release-update-source.test.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-release-update-source.py \
            hermes-agent/apps/desktop/electron/main.ts

      - name: Install deps and build
        working-directory: hermes-agent/apps/desktop
        run: |
          npm ci
          npm run build

      # Guards the overlay itself: reconciliation, the ignore rules that keep
      # credential files off the wire, and full sync passes against a fake
      # gateway. Runs before packaging so a broken bridge never ships.
      - name: Test overlays
        working-directory: hermes-agent/apps/desktop
        run: |
          npx vitest run --project electron \
            electron/local-workspace-bridge.test.ts \
            electron/release-update-source.test.ts

      - name: Package with electron-builder
        working-directory: hermes-agent/apps/desktop
        shell: bash
        env:
          HERMES_DESKTOP_REMOTE_ONLY: 'true'
          DESKTOP_BUILD_VERSION: ${{ needs.resolve.outputs.desktop_build_version }}
        run: |
          # Upstream's scripts/run-electron-builder.mjs already prepends
          # `--publish never` (CI=1 otherwise makes electron-builder resolve a
          # publish target). Passing it again would hand yargs the flag twice,
          # which yields the array ["never","never"] instead of the string
          # "never" — electron-builder then falls back to publishing and dies
          # on "GitHub Personal Access Token is not set". So only add the flag
          # when the wrapper that pins it is absent.
          if [ -f scripts/run-electron-builder.mjs ]; then
            npm run builder -- --config.extraMetadata.version="$DESKTOP_BUILD_VERSION"
          else
            npm run builder -- --publish never --config.extraMetadata.version="$DESKTOP_BUILD_VERSION"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: hermes-desktop-${{ matrix.os }}
          path: hermes-agent/apps/desktop/release/Hermes-*

  draft-release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          assets=$(find release-assets -type f -name 'Hermes-*' | tr '\n' ' ')
          if [ -z "$assets" ]; then
            echo "No packaged artifacts found; skipping release."; exit 0
          fi

          # resolve() already walked past every published tag, so an existing
          # release here is a draft we own and may refresh. A published one can
          # only mean a race with a concurrent run; leave the shipped bytes
          # alone and let the next run pick the next free overlay version.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::warning::$TAG was published while this run was building; keeping the shipped binaries and skipping the upload."
              exit 0
            fi
            gh release upload "$TAG" $assets --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Draft + prerelease: it stays hidden until you publish it, and
            # publishing surfaces it as a pre-release rather than displacing
            # the current stable download on the repo front page.
            gh release create "$TAG" \
              $assets \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --generate-notes \
              --title "Hermes Desktop $TAG"
          fi
