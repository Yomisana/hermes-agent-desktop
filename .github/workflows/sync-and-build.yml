name: build-desktop-release

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read pinned upstream and overlay versions
        id: version
        shell: bash
        run: python3 scripts/version-info.py --github-output "$GITHUB_OUTPUT"

      - name: Clone upstream hermes-agent
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "${{ steps.version.outputs.upstream_tag }}" "https://x-access-token:${{ github.token }}@github.com/NousResearch/hermes-agent.git" hermes-agent && exit 0
            echo "clone attempt $i failed; retrying in 45s"
            sleep 45
          done
          exit 1

      - name: Verify immutable upstream commit
        shell: bash
        run: |
          actual=$(git -C hermes-agent rev-parse HEAD)
          expected="${{ steps.version.outputs.upstream_sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "Pinned tag resolved to $actual, expected $expected"
            exit 1
          fi

      - name: Apply remote-only patch
        shell: bash
        run: |
          cp apps/desktop/electron/remote-bootstrap-policy.ts hermes-agent/apps/desktop/electron/
          cp apps/desktop/electron/remote-seed-connection.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-patch.py \
            hermes-agent/apps/desktop/electron/main.ts \
            hermes-agent/apps/desktop/package.json

      - name: Write seeded remote connection (company gateway)
        shell: bash
        env:
          HERMES_GATEWAY_URL: ${{ secrets.HERMES_GATEWAY_URL }}
        run: python3 scripts/write-seed.py hermes-agent/apps/desktop/build-resources/connection.seed.json "$HERMES_GATEWAY_URL" --allow-empty

      - name: Install deps and build
        working-directory: hermes-agent/apps/desktop
        run: |
          npm ci
          npm run build

      - name: Package with electron-builder
        working-directory: hermes-agent/apps/desktop
        env:
          HERMES_DESKTOP_REMOTE_ONLY: 'true'
          DESKTOP_BUILD_VERSION: ${{ steps.version.outputs.desktop_build_version }}
        run: npm run builder -- --publish never --config.extraMetadata.version="$DESKTOP_BUILD_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-${{ matrix.os }}
          path: hermes-agent/apps/desktop/release/Hermes-*

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream and overlay versions
        id: version
        shell: bash
        run: python3 scripts/version-info.py --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find release-assets -type f -name 'Hermes-*' | tr '\n' ' ')
          if [ -z "$assets" ]; then
            echo "No packaged artifacts found; skipping release."; exit 0
          fi
          tag="${{ steps.version.outputs.release_tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              $assets \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "Hermes Desktop $tag"
          fi
