name: build-desktop-release

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch: {}
  push:
    branches: [master]

env:
  UPSTREAM_REPO: https://github.com/NousResearch/hermes-agent.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone upstream hermes-agent
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "$UPSTREAM_BRANCH" "https://x-access-token:${{ github.token }}@github.com/NousResearch/hermes-agent.git" hermes-agent && exit 0
            echo "clone attempt $i failed; retrying in 45s"
            sleep 45
          done
          exit 1

      - name: Apply remote-only patch
        shell: bash
        run: |
          cp apps/desktop/electron/remote-bootstrap-policy.ts hermes-agent/apps/desktop/electron/
          cp apps/desktop/electron/remote-seed-connection.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-patch.py hermes-agent/apps/desktop/electron/main.ts

      - name: Write seeded remote connection (company gateway)
        shell: bash
        run: |
          mkdir -p hermes-agent/apps/desktop/build-resources
          cat > hermes-agent/apps/desktop/build-resources/connection.seed.json << JSON
          {
            "mode": "remote",
            "baseUrl": "${{ secrets.HERMES_GATEWAY_URL }}"
          }
          JSON

      - name: Install deps and build
        working-directory: hermes-agent/apps/desktop
        run: |
          npm ci
          npm run build

      - name: Package with electron-builder
        working-directory: hermes-agent/apps/desktop
        env:
          HERMES_DESKTOP_REMOTE_ONLY: 'true'
        run: npm run builder -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-${{ matrix.os }}
          path: hermes-agent/apps/desktop/release/*

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \) | tr '\n' ' ')
          if [ -z "$assets" ]; then
            echo "No packaged artifacts found; skipping release."; exit 0
          fi
          gh release create "desktop-$(date +%Y%m%d-%H%M%S)" \
            $assets \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "Hermes Desktop (remote-only) — $(date +%Y-%m-%d)"
