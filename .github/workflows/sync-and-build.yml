name: build-desktop-release

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read pinned upstream and overlay versions
        id: version
        shell: bash
        run: python3 scripts/version-info.py --github-output "$GITHUB_OUTPUT"

      - name: Clone upstream hermes-agent
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "${{ steps.version.outputs.upstream_tag }}" "https://x-access-token:${{ github.token }}@github.com/NousResearch/hermes-agent.git" hermes-agent && exit 0
            echo "clone attempt $i failed; retrying in 45s"
            sleep 45
          done
          exit 1

      - name: Verify immutable upstream commit
        shell: bash
        run: |
          actual=$(git -C hermes-agent rev-parse HEAD)
          expected="${{ steps.version.outputs.upstream_sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "Pinned tag resolved to $actual, expected $expected"
            exit 1
          fi

      - name: Apply remote-only patch
        shell: bash
        run: |
          cp apps/desktop/electron/remote-bootstrap-policy.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-patch.py \
            hermes-agent/apps/desktop/electron/main.ts

      - name: Apply local-workspace-bridge patch
        shell: bash
        run: |
          cp apps/desktop/electron/local-workspace-bridge.ts hermes-agent/apps/desktop/electron/
          cp apps/desktop/electron/local-workspace-bridge.test.ts hermes-agent/apps/desktop/electron/
          python3 scripts/apply-local-workspace-bridge.py \
            hermes-agent/apps/desktop/electron/main.ts \
            hermes-agent/apps/desktop/electron/preload.ts

      - name: Install deps and build
        working-directory: hermes-agent/apps/desktop
        run: |
          npm ci
          npm run build

      # Guards the overlay itself: reconciliation, the ignore rules that keep
      # credential files off the wire, and full sync passes against a fake
      # gateway. Runs before packaging so a broken bridge never ships.
      - name: Test local-workspace-bridge overlay
        working-directory: hermes-agent/apps/desktop
        run: npx vitest run --project electron electron/local-workspace-bridge.test.ts

      - name: Package with electron-builder
        working-directory: hermes-agent/apps/desktop
        shell: bash
        env:
          HERMES_DESKTOP_REMOTE_ONLY: 'true'
          DESKTOP_BUILD_VERSION: ${{ steps.version.outputs.desktop_build_version }}
        run: npm run builder -- --publish never --config.extraMetadata.version="$DESKTOP_BUILD_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: hermes-desktop-${{ matrix.os }}
          path: hermes-agent/apps/desktop/release/Hermes-*

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned upstream and overlay versions
        id: version
        shell: bash
        run: python3 scripts/version-info.py --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find release-assets -type f -name 'Hermes-*' | tr '\n' ' ')
          if [ -z "$assets" ]; then
            echo "No packaged artifacts found; skipping release."; exit 0
          fi
          tag="${{ steps.version.outputs.release_tag }}"

          # A release tag is derived from upstream.json (tag + overlayVersion),
          # so every push to master reuses it until overlayVersion is bumped.
          # Refreshing a DRAFT is fine — it was never handed to anyone. Rewriting
          # a PUBLISHED one silently swaps the bytes under a tag users already
          # downloaded, so stop and make the operator bump overlayVersion.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::$tag is already published. Bump overlayVersion in upstream.json (and the matching patches/manifest.json entry) instead of overwriting shipped binaries."
              exit 1
            fi
            gh release upload "$tag" $assets --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Draft + prerelease: it stays hidden until you publish it, and
            # publishing surfaces it as a pre-release rather than displacing
            # the current stable download on the repo front page.
            gh release create "$tag" \
              $assets \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --generate-notes \
              --title "Hermes Desktop $tag"
          fi
